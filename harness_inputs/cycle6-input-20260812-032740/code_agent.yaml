llm_config:
  api_key: ${env.LLM_API_KEY}
  api_type: openai_responses
  base_url: ${env.LLM_BASE_URL}
  max_tokens: 32000
  model: ${env.LLM_MODEL}
  reasoning:
    effort: high
    summary: detailed
  stream: true
  temperature: 0.7
  top_p: 0.95
max_context_tokens: 200000
max_iterations: 300
middlewares:
- import: middleware.execution_guard:ExecutionGuardMiddleware
  params:
    enable_delivery_gate: true
    enable_evidence_gate: true
    enable_final_gate: false
    enable_noop_recovery: true
    elapsed_warning_seconds: [300, 600, 900]
    exploratory_timeout_ms: 90000
    long_command_ms: 90000
    long_sleep_seconds: 90
    progress_warning_shell_calls: 8
- import: middleware.context_compaction:ContextCompactionMiddleware
  params:
    auto_compact: true
    compaction_strategy: tool_result_compaction
    emergency_compact_enabled: true
    keep_iterations: 6
    max_context_tokens: 200000
    threshold: 0.55
name: nexau_code_agent
system_prompt: ./systemprompt.md
system_prompt_type: jinja
tool_call_mode: openai
tools:
- binding: tools.shell_tools:run_shell_command
  name: run_shell_command
  yaml_path: ./tool_descriptions/run_shell_command.tool.yaml
tracers:
- import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
type: agent
