# Path C knife (Tess GO LRM-1028): KEEP stack + single SemanticOverExistenceGate
# (AHE §8 — do not treat import/existence/size/build success as sufficient;
# pair with at least one evaluator-facing semantic check).
# KEEP = SanitySmoke + ArtifactPublishGuard + EnumerateAllAnswers +
# IndependentValidator + ForbiddenExtras + BoundaryCase + this gate.
# No SHELVE knobs (≠ RecomputeFromArtifact / EndStateReady / SemanticNotProxy /
# Multistage / PreserveSemantics / OfficialChecker / FailFast / TrustCheck /
# WriteOnDiscovery / PersistBest / …).
# Inject (Tess TWEAK `2355` t2): after_tool sidecar + cleaned tool-note;
# before_model SYSTEM PREPEND/INSERT + first-USER PREPEND + sticky SYSTEM
# prefer + FRAMEWORK + trailing USER + sidecar; literal
# `SemanticOverExistenceGate:`. Semantic clear requires assert/value check —
# not bare cv2/ffprobe/tomllib/field-name in solution code (video miss-fire).
# Ban: 题面小抄 / feeding frame-bound or WAL value fixture answers.
llm_config:
  api_key: ${env.LLM_API_KEY}
  api_type: openai_chat_completion
  base_url: ${env.LLM_BASE_URL}
  additional_drop_params:
  - max_tokens
  - temperature
  - top_p
  max_completion_tokens: 4096
  model: ${env.LLM_MODEL}
  stream: true
max_context_tokens: 200000
max_iterations: 300
name: nexau_code_agent
system_prompt: ./systemprompt.md
system_prompt_type: jinja
tool_call_mode: openai
tools:
- binding: tools.shell_tools:run_shell_command
  name: run_shell_command
  yaml_path: ./tool_descriptions/run_shell_command.tool.yaml
middlewares:
- import: middleware.deliverable_sanity_smoke:DeliverableSanitySmokeMiddleware
  params:
    min_iterations_before_nudge: 3
    renudge_every_iterations: 8
    max_nudges: 4
    min_bytes: 8
- import: middleware.artifact_publish_guard:ArtifactPublishGuardMiddleware
  params:
    min_iterations_before_nudge: 4
    renudge_every_iterations: 12
    max_nudges: 3
- import: middleware.enumerate_all_answers_gate:EnumerateAllAnswersGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
- import: middleware.independent_validator_gate:IndependentValidatorGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
- import: middleware.forbidden_extras_gate:ForbiddenExtrasGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
- import: middleware.boundary_case_check_gate:BoundaryCaseCheckGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
- import: middleware.semantic_over_existence_gate:SemanticOverExistenceGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
tracers:
- import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
type: agent
