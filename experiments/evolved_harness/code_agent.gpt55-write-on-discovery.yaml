# Path C knife (Tess GO LRM-1016): KEEP stack + single WriteOnDiscoveryGate
# (AHE §6 manage time — write answer/artifact to exact path immediately;
# ban optional exploration after discovery).
# KEEP = SanitySmoke + ArtifactPublishGuard + EnumerateAllAnswers +
# IndependentValidator + this gate.
# No SHELVE knobs (≠ PersistBest / ShortProbe / StopAfterPass / TimeBudget /
# Checkpoint / PP / RereadDeliverable / LiteralContract / ContractFirst /
# MirrorEvaluator / FailFast / PreserveSemantics / GeneralizeNotOverfit /
# EndStateReady / ScratchThenPromote / PerfHeadroom / SemanticNotProxy /
# OfficialChecker / CanonicalEntry / hints).
# Inject: after_tool sidecar + cleaned tool-note marker; before_model SYSTEM
# PREPEND if present else INSERT + first-USER PREPEND + sticky SYSTEM-only +
# FRAMEWORK + trailing USER + sidecar; literal `WriteOnDiscoveryGate:`.
llm_config:
  api_key: ${env.LLM_API_KEY}
  api_type: openai_chat_completion
  base_url: ${env.LLM_BASE_URL}
  additional_drop_params:
  - max_tokens
  - temperature
  - top_p
  max_completion_tokens: 4096
  model: ${env.LLM_MODEL}
  stream: true
max_context_tokens: 200000
max_iterations: 300
name: nexau_code_agent
system_prompt: ./systemprompt.md
system_prompt_type: jinja
tool_call_mode: openai
tools:
- binding: tools.shell_tools:run_shell_command
  name: run_shell_command
  yaml_path: ./tool_descriptions/run_shell_command.tool.yaml
middlewares:
- import: middleware.deliverable_sanity_smoke:DeliverableSanitySmokeMiddleware
  params:
    min_iterations_before_nudge: 3
    renudge_every_iterations: 8
    max_nudges: 4
    min_bytes: 8
- import: middleware.artifact_publish_guard:ArtifactPublishGuardMiddleware
  params:
    min_iterations_before_nudge: 4
    renudge_every_iterations: 12
    max_nudges: 3
- import: middleware.enumerate_all_answers_gate:EnumerateAllAnswersGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
- import: middleware.independent_validator_gate:IndependentValidatorGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
- import: middleware.write_on_discovery_gate:WriteOnDiscoveryGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    min_risk_events: 1
tracers:
- import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
type: agent
