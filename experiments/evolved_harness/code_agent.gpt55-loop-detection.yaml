# Single-knob variant: finalize-best-candidate (prompt) + LoopDetection only.
# No SanitySmoke / ArtifactPublishGuard / TimeBudget — attribution knife (Tess 2026-07-31).
llm_config:
  api_key: ${env.LLM_API_KEY}
  api_type: openai_chat_completion
  base_url: ${env.LLM_BASE_URL}
  additional_drop_params:
  - max_tokens
  - temperature
  - top_p
  max_completion_tokens: 4096
  model: ${env.LLM_MODEL}
  stream: true
max_context_tokens: 200000
max_iterations: 300
name: nexau_code_agent
system_prompt: ./systemprompt.md
system_prompt_type: jinja
tool_call_mode: openai
tools:
- binding: tools.shell_tools:run_shell_command
  name: run_shell_command
  yaml_path: ./tool_descriptions/run_shell_command.tool.yaml
middlewares:
- import: middleware.execution_risk_hints:ExecutionRiskHintsMiddleware
- import: middleware.loop_detection:LoopDetectionMiddleware
  params:
    repeat_threshold: 3
    window_size: 24
    renudge_every_iterations: 8
    max_nudges: 3
tracers:
- import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
type: agent
