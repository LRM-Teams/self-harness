# Path C knife (Tess TWEAK `0556` / LRM-996 t2): KEEP stack + single
# ShortProbeFirstGate (AHE §6 short-probe / timeout_ms / bg long work).
# No SHELVE knobs (≠ TimeBudget / PersistBest / Checkpoint / PP / hints).
# Deliver t2: SYSTEM PREPEND if present else INSERT + first-USER PREPEND +
# sticky SYSTEM re-paint + FRAMEWORK + trailing USER + sidecar; literal
# `ShortProbeFirstGate:` for计票 (cleaned drops mid-run USER-only appends).
llm_config:
  api_key: ${env.LLM_API_KEY}
  api_type: openai_chat_completion
  base_url: ${env.LLM_BASE_URL}
  additional_drop_params:
  - max_tokens
  - temperature
  - top_p
  max_completion_tokens: 4096
  model: ${env.LLM_MODEL}
  stream: true
max_context_tokens: 200000
max_iterations: 300
name: nexau_code_agent
system_prompt: ./systemprompt.md
system_prompt_type: jinja
tool_call_mode: openai
tools:
- binding: tools.shell_tools:run_shell_command
  name: run_shell_command
  yaml_path: ./tool_descriptions/run_shell_command.tool.yaml
middlewares:
- import: middleware.deliverable_sanity_smoke:DeliverableSanitySmokeMiddleware
  params:
    min_iterations_before_nudge: 3
    renudge_every_iterations: 8
    max_nudges: 4
    min_bytes: 8
- import: middleware.artifact_publish_guard:ArtifactPublishGuardMiddleware
  params:
    min_iterations_before_nudge: 4
    renudge_every_iterations: 12
    max_nudges: 3
- import: middleware.short_probe_first_gate:ShortProbeFirstGateMiddleware
  params:
    min_iterations_before_nudge: 2
    renudge_every_iterations: 8
    max_nudges: 3
    long_step_ms: 90000
    min_env_probe_repeats: 2
tracers:
- import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
type: agent
